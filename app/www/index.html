<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>HR DO CALDO APP</title>
<style>
:root{--red:#b3261e;--red2:#d6402b;--ink:#2a1512;--mut:#7a6a64;--bg:#f7f2ec;--line:#eadfd6;--ok:#2e7d32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}body{font-family:system-ui,-apple-system,Roboto,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none}
button{font-family:inherit}
/* login */
#login{min-height:100%;display:none;flex-direction:column;justify-content:center;padding:28px;background:radial-gradient(circle at 20% 0%,#8a2218,#2a1512 65%)}
#login .box{background:#fff;border-radius:26px;padding:30px 24px;box-shadow:0 30px 60px #0006}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--red2),var(--red));display:grid;place-items:center;font-size:36px;margin:0 auto 12px;box-shadow:0 10px 24px #b3261e55}
#login h1{text-align:center;margin:0;font-size:22px;letter-spacing:.5px}#login p{text-align:center;margin:4px 0 20px;color:var(--mut);font-size:14px}
input,textarea{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:14px;font-size:16px;background:#fdfaf7;outline:none;margin-bottom:12px;font-family:inherit;-webkit-user-select:text;user-select:text}
input:focus,textarea:focus{border-color:var(--red);background:#fff}
.big{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;font-size:17px;font-weight:800;box-shadow:0 8px 20px #b3261e44}
.big:disabled{background:#c9bdb6;box-shadow:none}.link{background:none;border:0;color:#d9c9bf;margin-top:18px;font-size:13px;text-decoration:underline}
.err{background:#fde8e6;color:#9b1c14;padding:11px 14px;border-radius:12px;font-size:14px;margin-bottom:12px;display:none}
/* app */
#app{display:none;height:100%;flex-direction:column}
header{background:linear-gradient(135deg,var(--red2),var(--red));color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header .t{flex:1;line-height:1.15}header b{font-size:17px;letter-spacing:.3px}header small{opacity:.85;font-size:12px;display:block}
header button{background:#ffffff26;border:0;color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px}
.tools{background:#fff;padding:10px 12px 6px;box-shadow:0 2px 8px #0001;z-index:2}
.tools input{margin:0 0 8px;padding:12px 14px;border-radius:12px}
#cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}#cats::-webkit-scrollbar{display:none}
#cats button{white-space:nowrap;border:0;background:#f1e8df;color:var(--ink);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600}#cats button.on{background:var(--red);color:#fff}
#list{flex:1;overflow-y:auto;padding:10px 12px 110px}
.p{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;margin-bottom:10px;padding:13px 14px;border-radius:16px;box-shadow:0 2px 8px #5a2a1a12}
.p.has{outline:2px solid var(--red)}.p .n{font-size:16px;font-weight:600}.p .pr{color:var(--red);font-weight:800;margin-top:3px}
.q{display:flex;align-items:center;gap:10px}.q button{width:42px;height:42px;border-radius:50%;border:0;font-size:24px;font-weight:700;background:var(--red);color:#fff}.q button.m{background:#eadfd6;color:var(--ink)}.q span{min-width:22px;text-align:center;font-size:19px;font-weight:800}
.msg{text-align:center;color:var(--mut);padding:50px 20px;line-height:1.6}.msg button{margin-top:14px;padding:12px 22px;border:0;border-radius:12px;background:var(--red);color:#fff;font-weight:700}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 35%)}
#bar .big{background:linear-gradient(135deg,#3b9a40,var(--ok));box-shadow:0 8px 20px #2e7d3244}
/* sheet */
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:10}
#sheet .in{background:#fff;width:100%;max-height:92%;overflow-y:auto;padding:20px 18px calc(env(safe-area-inset-bottom) + 18px);border-radius:26px 26px 0 0;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet h3{margin:0 0 10px;font-size:19px}.l{display:flex;justify-content:space-between;padding:6px 0;font-size:16px}.tot{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;font-size:20px;font-weight:800;display:flex;justify-content:space-between}
.lbl{font-weight:700;margin:16px 0 8px;font-size:15px}
.mesas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mesas button{padding:15px 0;font-size:18px;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:14px;color:var(--ink)}.mesas button.on{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:10px;margin-top:14px}.row button{flex:1}.sec{background:#eadfd6;color:var(--ink);box-shadow:none!important;background-image:none!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 4px}.seg button{padding:14px 0;border:2px solid var(--line);background:#fff;border-radius:14px;font-size:16px;font-weight:800;color:var(--ink)}.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:14px;right:14px;background:var(--ink);color:#fff;padding:15px;border-radius:14px;display:none;z-index:30;text-align:center;font-weight:600}
#toast.ok{background:var(--ok)}
</style></head><body>

<div id="login">
  <div class="box">
    <div class="logo">🍲</div><h1>HR DO CALDO APP</h1><p>Entre com seu usuário de garçom</p>
    <div class="err" id="lerr"></div>
    <input id="lu" placeholder="Usuário" autocapitalize="none" autocomplete="username">
    <input id="lp" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="big" id="lbtn" onclick="doLogin()">Entrar</button>
  </div>
  <button class="link" onclick="chgSite()">Alterar endereço do site</button>
</div>

<div id="app">
  <header><div class="t"><b>🍲 HR DO CALDO</b><small id="who"></small></div><button onclick="load(true)" title="Atualizar">⟳</button><button onclick="logout()" title="Sair">⎋</button></header>
  <div class="tools"><input id="srch" placeholder="🔍 Buscar item..." oninput="render()"><div id="cats"></div></div>
  <div id="list"></div>
  <div id="bar"><button class="big" id="go" onclick="openSheet()" disabled>Selecione os itens</button></div>
</div>

<div id="sheet" onclick="if(event.target===this)closeSheet()"><div class="in">
  <h3>Resumo do pedido</h3><div id="sum"></div>
  <div class="seg"><button id="tmesa" class="on" onclick="setTipo('mesa')">🪑 Mesa</button><button id="tent" onclick="setTipo('entrega')">🛵 Entrega</button></div>
  <div id="boxMesa"><div class="lbl">Escolha a mesa</div><div class="mesas" id="mesas"></div></div>
  <div id="boxEnt" style="display:none"><div class="lbl">Dados da entrega</div>
    <input id="ecli" placeholder="Nome do cliente *" autocomplete="off"><input id="eend" placeholder="Endereço" autocomplete="off"><input id="etel" type="tel" placeholder="Telefone (opcional)"></div>
  <div class="lbl">Observação</div><textarea id="note" rows="2" placeholder="Ex: sem cebola, sem gelo..."></textarea>
  <div class="row"><button class="big sec" onclick="closeSheet()">Voltar</button><button class="big" id="send" onclick="sendOrder()">ENVIAR PEDIDO</button></div>
</div></div>
<div id="toast"></div>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const LS={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const R=v=>"R$ "+Number(v).toFixed(2).replace(".",",");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=LS.get("token"),menu=[],mesas=[],cart={},cat="",mesa="",tipo="mesa";
function site(){return (LS.get("site")||(window.APP_CONFIG&&APP_CONFIG.SITE_URL)||"").replace(/\/+$/,"")}
function toast(t,ok,ms){const e=$("toast");e.textContent=t;e.className=ok?"ok":"";e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",ms||3200)}
async function api(r,data){
  const o={headers:{"X-Token":token}};
  if(data!==undefined){o.method="POST";o.headers["Content-Type"]="application/json";o.body=JSON.stringify(data)}
  let res;try{res=await fetch(site()+"/api.php?r="+r,o)}catch(e){throw new Error("Sem conexão com o site. Verifique a internet.")}
  let j={};try{j=await res.json()}catch(e){throw new Error("Resposta inválida do site (confira o endereço).")}
  if(res.status===401&&r!=="login"){logout(true);throw new Error("Sessão expirada")}
  if(!res.ok||j.error)throw new Error(j.error||("Erro "+res.status));return j}
function chgSite(){const v=prompt("Endereço do site (ex: https://meusite.com.br)",site());if(v!==null){LS.set("site",v.trim().replace(/\/+$/,""));toast("Endereço salvo",true)}}
async function doLogin(){
  const b=$("lbtn"),er=$("lerr");er.style.display="none";b.disabled=true;b.textContent="Entrando...";
  try{const j=await api("login",{username:$("lu").value.trim(),password:$("lp").value});
    token=j.token;LS.set("token",token);LS.set("name",j.name);$("lp").value="";start()}
  catch(e){er.textContent=e.message;er.style.display="block"}
  b.disabled=false;b.textContent="Entrar"}
function logout(silent){if(!silent&&token)api("logout",{}).catch(()=>{});token="";LS.del("token");cart={};mesa="";$("app").style.display="none";$("login").style.display="flex"}
function start(){$("login").style.display="none";$("app").style.display="flex";$("who").textContent="Garçom: "+LS.get("name");load(true)}
async function load(manual){
  $("list").innerHTML='<div class="msg">Carregando cardápio...</div>';
  try{const [m,t]=await Promise.all([api("menu"),api("mesas")]);menu=m;mesas=t;if(cat&&!menu.some(p=>p.category==cat))cat="";render();if(manual===true&&menu.length)toast("Cardápio atualizado",true,1500)}
  catch(e){if(token)$("list").innerHTML='<div class="msg">'+esc(e.message)+'<br><button onclick="load(true)">Tentar de novo</button></div>'}}
function render(){
  const cs=[...new Set(menu.map(p=>p.category))],s=$("srch").value.trim().toLowerCase();
  $("cats").innerHTML=[["","Todos"],...cs.map(c=>[c,c])].map(([v,l])=>`<button class="${cat==v?"on":""}" data-c="${esc(v)}" onclick="setCat(this.dataset.c)">${esc(l)}</button>`).join("");
  const it=menu.filter(p=>(!cat||p.category==cat)&&(!s||p.name.toLowerCase().includes(s)));
  $("list").innerHTML=it.map(p=>`<div class="p ${cart[p.id]?"has":""}" id="p${p.id}"><div><div class="n">${esc(p.name)}</div><div class="pr">${R(p.price)}</div></div>
   <div class="q"><button class="m" onclick="chg(${p.id},-1)">−</button><span id="q${p.id}">${cart[p.id]||0}</span><button onclick="chg(${p.id},1)">+</button></div></div>`).join("")
   ||'<div class="msg">Nenhum item encontrado.<br>Cadastre os produtos no painel do site.</div>';
  bar()}
function setCat(c){cat=c;render()}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];
  const q=$("q"+id);if(q)q.textContent=cart[id]||0;const p=$("p"+id);if(p)p.classList.toggle("has",!!cart[id]);bar();if(navigator.vibrate)navigator.vibrate(8)}
const tot=()=>menu.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0);
function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0),b=$("go");b.disabled=!n;b.textContent=n?`Ver pedido (${n} ${n>1?"itens":"item"}) · ${R(tot())}`:"Selecione os itens"}
function openSheet(){
  $("sum").innerHTML=menu.filter(p=>cart[p.id]).map(p=>`<div class="l"><span>${cart[p.id]}x ${esc(p.name)}</span><span>${R(cart[p.id]*p.price)}</span></div>`).join("")+`<div class="tot"><span>Total</span><span>${R(tot())}</span></div>`;
  $("mesas").innerHTML=mesas.map(m=>`<button class="${mesa==m.name?"on":""}" data-m="${esc(m.name)}" onclick="mesa=this.dataset.m;openSheet()">${esc(m.name)}</button>`).join("")||'<div class="msg" style="grid-column:1/-1;padding:10px">Nenhuma mesa cadastrada.</div>';
  $("sheet").style.display="flex"}
function setTipo(v){tipo=v;$("tmesa").classList.toggle("on",v==="mesa");$("tent").classList.toggle("on",v==="entrega");$("boxMesa").style.display=v==="mesa"?"block":"none";$("boxEnt").style.display=v==="entrega"?"block":"none"}
function closeSheet(){$("sheet").style.display="none"}
async function sendOrder(){
  const cli=$("ecli").value.trim();
  if(tipo==="mesa"&&!mesa){toast("Escolha a mesa ou marque Entrega");return}
  if(tipo==="entrega"&&!cli){toast("Informe o nome do cliente da entrega");return}
  const b=$("send");b.disabled=true;b.textContent="Enviando...";
  try{const r=await api("order",{tipo,mesa,cliente:cli,endereco:$("eend").value.trim(),telefone:$("etel").value.trim(),note:$("note").value,items:Object.entries(cart).map(([id,qty])=>({id:+id,qty}))});
    toast(tipo==="entrega"?`✔ Entrega #${r.id} (${cli}) enviada para a cozinha`:`✔ Pedido ${r.id} enviado para a cozinha - Mesa ${mesa}`,true,4000);if(navigator.vibrate)navigator.vibrate([60,40,60]);
    cart={};mesa="";$("note").value="";$("ecli").value="";$("eend").value="";$("etel").value="";setTipo("mesa");closeSheet();render()}
  catch(e){toast("Não enviou: "+e.message,false,5000)}
  b.disabled=false;b.textContent="ENVIAR PEDIDO"}
$("lp").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
if(token)start();else $("login").style.display="flex";
</script></body></html>
