<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HR DO CALDO APP</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:Arial,sans-serif;background:#f4f1ec;padding-bottom:90px}
header{position:sticky;top:0;background:#b3261e;color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;z-index:5}
header b{font-size:18px}header button{background:none;border:0;color:#fff;font-size:22px}
#cats{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;position:sticky;top:50px;z-index:4}
#cats button{white-space:nowrap;border:0;background:#eee;padding:10px 16px;border-radius:20px;font-size:15px}#cats button.on{background:#b3261e;color:#fff}
.p{display:flex;align-items:center;justify-content:space-between;background:#fff;margin:8px 10px;padding:12px;border-radius:12px;box-shadow:0 1px 3px #0002}
.p small{color:#b3261e;font-weight:700;font-size:15px}.q{display:flex;align-items:center;gap:12px}
.q button{width:40px;height:40px;border-radius:50%;border:0;background:#b3261e;color:#fff;font-size:22px}.q button.m{background:#ccc;color:#333}.q span{min-width:20px;text-align:center;font-size:18px}
#bar{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#fff;box-shadow:0 -2px 8px #0003}
#bar button{width:100%;padding:16px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:18px;font-weight:700}#bar button:disabled{background:#aaa}
#sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}
#sheet div.in{background:#fff;width:100%;max-height:90%;overflow:auto;padding:16px;border-radius:16px 16px 0 0}
.mesas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.mesas button{padding:16px 0;font-size:18px;border:2px solid #ddd;background:#fff;border-radius:10px}.mesas button.on{background:#b3261e;color:#fff;border-color:#b3261e}
textarea,input{width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:14px;font-size:16px;border:0;border-radius:10px}
#toast{position:fixed;top:70px;left:10px;right:10px;background:#222;color:#fff;padding:14px;border-radius:10px;display:none;z-index:20;text-align:center}.msg{padding:30px;text-align:center;color:#666}
</style></head><body>
<header><b>🍲 HR DO CALDO APP</b><button onclick="cfg()">⚙️</button></header>
<div id="cats"></div><div id="list"></div>
<div id="bar"><button id="go" onclick="openSheet()" disabled>Selecione os itens</button></div>
<div id="sheet"><div class="in">
 <h3 style="margin-top:0">Resumo do pedido</h3><div id="sum"></div>
 <b>Mesa:</b><div class="mesas" id="mesas"></div>
 <textarea id="note" rows="2" placeholder="Observação (ex: sem cebola)"></textarea>
 <div class="row"><button style="background:#ddd" onclick="closeSheet()">Voltar</button><button id="send" style="background:#2e7d32;color:#fff" onclick="send()">ENVIAR PEDIDO</button></div>
</div></div><div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let srv=localStorage.getItem("srv")||"",menu=[],mesas=[],cart={},cat="",mesa="";
const url=p=>"http://"+srv+p,R=v=>"R$ "+v.toFixed(2).replace(".",",");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(t,ms=3000){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",ms)}
function cfg(){const v=prompt("Endereço do computador (aparece no HORA DO CALDO PC).\nEx: 192.168.0.10:5000",srv);
 if(v!==null){srv=v.trim().replace(/^https?:\/\//,"");localStorage.setItem("srv",srv);load()}}
async function load(){
 if(!srv){$("list").innerHTML='<div class="msg">Toque em ⚙️ e digite o endereço do computador.</div>';return}
 try{const [m,t]=await Promise.all([fetch(url("/api/menu")).then(r=>r.json()),fetch(url("/api/mesas")).then(r=>r.json())]);
  menu=m;mesas=t;if(!cat||!menu.some(p=>p.category==cat))cat="";render()}
 catch(e){$("list").innerHTML='<div class="msg">Sem conexão com o computador.<br>Verifique o Wi-Fi e o endereço (⚙️).<br><br><button onclick="load()" style="padding:12px 20px">Tentar de novo</button></div>'}}
function render(){const cs=[...new Set(menu.map(p=>p.category))];
 $("cats").innerHTML=[["","Todos"],...cs.map(c=>[c,c])].map(([v,l])=>`<button class="${cat==v?"on":""}" onclick="setCat(this.dataset.c)" data-c="${esc(v)}">${esc(l)}</button>`).join("");
 $("list").innerHTML=menu.filter(p=>!cat||p.category==cat).map(p=>`<div class="p"><div>${esc(p.name)}<br><small>${R(p.price)}</small></div>
 <div class="q"><button class="m" onclick="chg(${p.id},-1)">−</button><span id="q${p.id}">${cart[p.id]||0}</span><button onclick="chg(${p.id},1)">+</button></div></div>`).join("")||'<div class="msg">Nenhum item cadastrado.</div>';bar()}
function setCat(c){cat=c;render()}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];$("q"+id).textContent=cart[id]||0;bar()}
function tot(){return menu.reduce((s,p)=>s+(cart[p.id]||0)*p.price,0)}
function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$("go").disabled=!n;$("go").textContent=n?`Ver pedido (${n} itens) - ${R(tot())}`:"Selecione os itens"}
function openSheet(){$("sum").innerHTML=menu.filter(p=>cart[p.id]).map(p=>`<div>${cart[p.id]}x ${esc(p.name)} <span style="float:right">${R(cart[p.id]*p.price)}</span></div>`).join("")+`<hr><b>Total: ${R(tot())}</b>`;
 $("mesas").innerHTML=mesas.map(m=>`<button class="${mesa==m.name?"on":""}" data-m="${esc(m.name)}" onclick="mesa=this.dataset.m;openSheet()">${esc(m.name)}</button>`).join("");$("sheet").style.display="flex"}
function closeSheet(){$("sheet").style.display="none"}
async function send(){if(!mesa)return toast("Escolha a mesa");
 $("send").disabled=true;
 try{const r=await fetch(url("/api/orders"),{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify({mesa,note:$("note").value,items:Object.entries(cart).map(([id,qty])=>({id:+id,qty}))})}).then(r=>r.json());
  if(r.error)throw new Error(r.error);
  toast(r.printed?`✔ Pedido ${r.id} enviado - Mesa ${mesa}`:`Pedido ${r.id} salvo, mas: ${r.msg}`,4000);
  cart={};mesa="";$("note").value="";closeSheet();render()}
 catch(e){toast("Erro ao enviar: "+e.message)}
 $("send").disabled=false}
load();
</script></body></html>
