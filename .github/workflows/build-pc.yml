name: Build PC (EXE)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install flask pywin32 pyinstaller
      - run: pyinstaller --onefile --name HORA_DO_CALDO_PC --hidden-import win32print --add-data "web;web" server.py
        working-directory: pc
      - uses: actions/upload-artifact@v4
        with: { name: HORA_DO_CALDO_PC, path: pc/dist/HORA_DO_CALDO_PC.exe }
